<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320">
  <defs>
    <filter id="marble" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="3" seed="7"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.46&#xA;                             0 0 0 0 0.42&#xA;                             0 0 0 0 0.34&#xA;                             0 0 0 0.35 0"></feColorMatrix>
      <feComposite in="SourceGraphic" operator="in"></feComposite>
    </filter>
    <filter id="vein" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.004 0.018" numOctaves="2" seed="3"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="20"></feDisplacementMap>
    </filter>
  </defs>
  <rect width="600" height="320" fill="#FFFFFF" filter="url(#marble)" opacity="0.6"></rect>
  <g stroke="#7d735c" stroke-width="0.5" fill="none" opacity="0.22" filter="url(#vein)">
    <path d="M-20 60 C 120 110, 280 30, 420 90 S 620 60, 700 80"></path>
    <path d="M-20 150 C 150 200, 280 140, 460 180 S 620 200, 700 170"></path>
    <path d="M-20 240 C 160 280, 320 220, 480 260 S 620 240, 700 260"></path>
    <path d="M-20 20 C 100 50, 200 0, 320 30" stroke-width="0.4" opacity="0.6"></path>
    <path d="M120 0 C 140 120, 100 220, 160 320" stroke-width="0.4"></path>
    <path d="M380 0 C 420 100, 380 220, 440 320" stroke-width="0.4" opacity="0.5"></path>
  </g>
  <g stroke="#a89c80" stroke-width="0.4" fill="none" opacity="0.16">
    <path d="M-20 90 C 100 70, 220 130, 380 100 S 600 110, 700 90"></path>
    <path d="M-20 200 C 180 230, 360 190, 540 220 S 700 220, 720 210"></path>
  </g>
</svg>